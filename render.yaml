services:
  - type: web
    name: arada-barbershop-backend
    env: node
    plan: starter
    region: frankfurt # Low latency to East Africa / Europe
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/availability
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Africa/Addis_Ababa
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SHOP_CHAT_ID
        sync: false

